# 应用服务 WEB 访问端口
server.port=8080
#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*.xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=org.example.learntrace.mybatis.entity

#数据库连接
spring.datasource.url = jdbc:mysql://127.0.0.1:3306/learntrace_db
spring.datasource.username=root
spring.datasource.password=123456

#启动时设置数据库
spring.sql.init.mode=always



